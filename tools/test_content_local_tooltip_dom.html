<!doctype html>
<meta charset="utf-8">
<title>Tooltip DOM tests</title>
<pre id="result">Running…</pre>
<script src="test_content_tooltip_dom.js"></script>
<script src="test_content_wildcards.js"></script>
<script src="test_content_guide_terms.js"></script>
<script src="test_content_resources.js"></script>
<script>
(async () => {
  const input = await fetch('../tmp/local-fixtures/maxroll_skarn_tooltip.html');
  if (!input.ok) throw new Error('Local captured inputs are required in tmp/local-fixtures. Use test_content_tooltip_dom.html for self-authored tests.');
  const [source, dictionary, fixture, sealFixture, ...skillFixtures] = await Promise.all([
    fetch('../sources/content.js').then(r => r.text()),
    fetch('../sources/translations.json').then(r => r.json()),
    fetch('../tmp/local-fixtures/maxroll_skarn_tooltip.html').then(r => r.text()),
    fetch('../tmp/local-fixtures/maxroll_seal_tooltip.html').then(r => r.text()),
    ...['abodian', 'destruction_demon', 'skull_splitter', 'planner_meta', 'planner_sigil', 'planner_molten', 'planner_prison'].map(name =>
      fetch(`../tmp/local-fixtures/maxroll_${name}_tooltip.html`).then(r => r.text()))
  ]);
  new Function(source); // Syntax check of the complete content script.
  const chromeStub = {
    storage: {
      onChanged: {addListener() {}},
      sync: {get(keys, callback) {callback({enabled: true, guideTranslationEnabled: true});}}
    },
    runtime: {getURL(path) {return path;}}
  };
  // Keep the real definitions; omit automatic page observation and initialization.
  const prefix = source.slice(0, source.indexOf('    let debounceTimer;'));
  const createApi = () => new Function('chrome', 'fetch', `let api;
    ${prefix}
    api = {loadTranslations, replaceText, applyRegexTransformations, observeDOM, findStyledTranslationInSentence,
      processMaxrollGuideRoot, translateGuideTextNodesInPlace, translateGuideSemanticElements, collectGuideBlocks,
      getWildcardCaptureIndexes, hasUnsafeWildcardMatch, dynamicValue: DYNAMIC_VALUE_TEXT};
    }}); return api;`)(chromeStub, async () => ({ok: true, json: async () => dictionary}));
  const api = createApi();
  const table = await api.loadTranslations();
  const glyphFixture = await fetch('../tmp/local-fixtures/maxroll_guide_glyph.html').then(r => r.text());
  const cubeFixture = await fetch('../tmp/local-fixtures/maxroll_cube_article.html').then(r => r.text());
  const hellguardFixture = await fetch('../tmp/local-fixtures/hellguard_csv_markup.html').then(r => r.text());
  const heshaFixtures = await Promise.all(['link', 'equipment'].map(name =>
    fetch(`../tmp/local-fixtures/maxroll_hesha_${name}_tooltip.html`).then(r => r.text())));
  const minionFixtures = await Promise.all(['reaper', 'shadow_mage', 'iron_golem'].map(name =>
    fetch(`../tmp/local-fixtures/maxroll_minion_${name}.html`).then(r => r.text())));
  const warlockFixtures = await fetch('../tmp/local-fixtures/maxroll_warlock_shards.json').then(r => r.json());
  const sorcererFixtures = await fetch('../tmp/local-fixtures/maxroll_sorcerer_enchantments.json').then(r => r.json());
  window.testResult = {
    resources: await runContentResourceTests(createApi, api, chromeStub, cubeFixture),
    guide: await runContentGuideTermTests(api, table, chromeStub, glyphFixture),
    dom: runContentTooltipDomTests(api, table, fixture, sealFixture, skillFixtures.slice(0, 3), hellguardFixture),
    planner: await runContentPlannerTooltipDomTests(api, table, skillFixtures.slice(3), sealFixture),
    hesha: await runContentHeshaTooltipDomTests(api, table, heshaFixtures),
    minions: runContentMinionTooltipDomTests(api, table, minionFixtures),
    warlock: runContentWarlockTooltipDomTests(api, table, warlockFixtures),
    sorcerer: runContentSorcererTooltipDomTests(api, table, sorcererFixtures),
    text: runContentWildcardTests(api)
  };
  document.querySelector('#result').textContent = JSON.stringify(window.testResult, null, 2);
})().catch(error => {
  window.testResult = {error: String(error), stack: error.stack};
  document.querySelector('#result').textContent = JSON.stringify(window.testResult, null, 2);
});
</script>
