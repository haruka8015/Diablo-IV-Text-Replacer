<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Diablo4 攻略サイト日本語化ツール</title>
  <style>
    body {
      width: 260px;
      font-family: Arial, sans-serif;
      background-color: white; /* 常に白い背景 */
      color: black; /* 常に黒い文字 */
      padding: 8px;
      margin: 0;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #333; /* ダークモードの背景色 */
        color: white; /* ダークモードの文字色 */
      }
      .slider {
        background-color: #666;
      }
      .slider:before {
        background-color: white;
      }
      #version {
        color: #aaa;
      }
      #translatorStatus {
        color: #bbb;
      }
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 20px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 34px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 12px;
      width: 12px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #2196F3;
    }
    input:checked + .slider:before {
      transform: translateX(14px);
    }
    h1 {
      font-size: 18px;
      margin: 0 0 12px;
    }
    .setting-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
    }
    button {
      display: block;
      margin: 10px 0;
      background-color: #2196F3;
      color: white;
      border: none;
      padding: 10px;
      cursor: pointer;
      width: 100%;
    }
    button:hover:not(:disabled) {
      background-color: #1976D2;
    }
    button:disabled {
      cursor: default;
      opacity: 0.55;
    }
    #translatorStatus {
      min-height: 1.2em;
      margin-top: 4px;
      color: #666;
      font-size: 12px;
    }
    #version {
      position: static;
      margin-top: 4px;
      padding-right: 2px;
      text-align: right;
      line-height: 1.2;
      font-size: 10px;
      color: #888;
    }
  </style>
</head>
<body>
<h1>Diablo4 攻略サイト日本語化ツール</h1>
<div class="setting-row">
  <label class="switch">
    <input type="checkbox" id="toggleSwitch">
    <span class="slider"></span>
  </label>
  <span>変換機能</span>
</div>
<div class="setting-row">
  <label class="switch">
    <input type="checkbox" id="translationToggle">
    <span class="slider"></span>
  </label>
  <span>Maxroll解説文を翻訳</span>
</div>
<button id="downloadModelButton">英→日 翻訳モデルをダウンロード</button>
<div id="translatorStatus" role="status" aria-live="polite"></div>
<button id="convertButton">手動で変換</button>
<div id="version"></div>
<script src="popup.js"></script>
</body>
</html>
